> **Documento de venta** del servicio de consultoria de advisory y especificacion de requisitos, emitido por **Kulgops** hacia el prospecto/cliente. Generado de forma **determinista** por el motor del advisory (Python stdlib, sin red ni LLM) a partir del analisis del corpus; espanol con etiquetas tecnicas en ingles.

## a. Quienes somos

**Kulgops** es una consultora de tecnologia enfocada en **ingenieria de software**, **advisory** de arquitectura y transformacion, y **especificacion de requisitos** para el desarrollo de software. Acompanamos a las organizaciones desde el descubrimiento hasta la definicion de un backlog accionable, para que la construccion arranque con el minimo de ambiguedad y el maximo de trazabilidad.

> **Perfil corporativo de referencia [DOC-ASSUMPTION].** El perfil de **Kulgops** (historia, tamano, clientes, certificaciones) se presenta de forma **generica y plausible** como referencia recalibrable; **no** se presenta como dato verificado. Cambiar la marca emisora o el perfil no altera la metodologia ni el alcance de este documento.

Nuestra **propuesta de valor**: convertir un corpus heterogeneo de documentacion (RFPs, assessments, diagramas, procesos) en un diseno **TO-BE** fundamentado, con honestidad epistemica y una estimacion lo mas acertada posible. Servicios principales:

- **Advisory de arquitectura y transformacion** (AS-IS -> TO-BE).
- **Especificacion de requisitos** (historias de usuario + BDD/Gherkin).
- **Ingenieria de software** y diseno de solucion.
- **Gobierno del cambio** y habilitacion del modelo operativo.

## b. Alcance del servicio

El servicio ofertado es una **consultoria de advisory** mas la **especificacion de requisitos para desarrollo de software**. El objetivo de esta etapa es dejar el proyecto **listo para estimar y construir**: no entregamos el producto final, sino el **diseno, las specs y los insumos de estimacion** que habilitan una construccion predecible.

El alcance cubre, de punta a punta:

- **Descubrimiento e higiene epistemica** del corpus del cliente.
- **Diagnostico AS-IS** (negocio, aplicacion, datos, integracion, infraestructura, seguridad) y **estado del arte**.
- **Identificacion de gaps** y viabilizacion (relievers, ABBs).
- **Diseno TO-BE** y **especificacion de requisitos** (HU + Gherkin).
- **Roadmap, estimacion recalibrable, RAID y caso de negocio**.

Queda **fuera de alcance** en esta etapa la construccion del software, la ejecucion de pruebas sobre codigo productivo y el despliegue; estos se habilitan con los entregables de esta propuesta.

## c. Contexto de negocio

Para ilustrar la propuesta usamos como **ejemplo** el corpus que estamos procesando: **Credi10 2.0** del grupo **STF Group** [VERIFIED-FACT]. Es un negocio de **credito retail de consumo** con canales **B2C y ecommerce**, cuyo ciclo abarca originacion, estudio de credito (CrossCore -> Inspektor -> Datacredito/Dictum), desembolso con generacion de RCL/RCR en el ERP Siesa/UnoEE, recaudo y pagos (PayU / link de pagos), corte de cartera y cobranza multicanal.

Para este ejemplo procesamos **18** documentos del corpus **sin muestreo** (RFP, assessment WSO2/Studio F, diagramas de arquitectura y PDFs de proceso), de los que derivamos el contexto de negocio y la trazabilidad.

Diagrama de **contexto de alto nivel** del negocio procesado:

```mermaid
flowchart LR
    CLIENTE(["Cliente / Asesor"]) --> ORIG["Originacion y onboarding"]
    ORIG --> EC["Estudio de credito<br/>CrossCore / Inspektor / Datacredito"]
    EC --> DES["Desembolso + RCL/RCR<br/>ERP Siesa/UnoEE"]
    DES --> REC["Recaudo y pagos<br/>PayU / Link de pagos"]
    REC --> CAR["Corte de cartera"]
    CAR --> COB["Cobranza multicanal<br/>SMS / WhatsApp / predictiva"]
    COB --> REC
    B2C(["Canal B2C / ecommerce"]) --> ORIG
```


> El contexto se **deriva** del corpus del cliente; los datos de Credi10/STF Group se citan como **ejemplo de aplicacion** y se tratan con las etiquetas epistemicas correspondientes, nunca como atributos de la consultora.

## d. Metodologia de consultoria

Trabajamos con una metodologia **por fases con quality gates** y **gobierno continuo**. Cada fase produce entregables verificables y no avanza hasta superar su gate (QG-0..QG-6), lo que evita el *scope drift* y mantiene la trazabilidad de punta a punta (el **Hilo Dorado**).

| Fase | Foco | Quality Gate |
| --- | --- | --- |
| Fase 0 | Higiene epistemica del corpus | QG-0 |
| Fase 1 | Contexto AS-IS | QG-1 |
| Fase 2 | Estado del arte | QG-2 |
| Fase 3 | Gaps y viabilizacion | QG-3 |
| Fase 4 | Diseno TO-BE + specs | QG-4 |
| Fase 5 | Roadmap, estimacion y RAID | QG-5 |
| Fase 6 | Caso de negocio | QG-6 |

La calidad se audita con el marco **AICV-E** (Accuracy, Integrity, Congruence, Viability, Epistemic Certainty): cada entregable se somete a verificacion antes de cruzar su gate, y la honestidad epistemica es un principio no negociable (no se fabrica evidencia).

## f. Estrategia de consultoria

Nuestra estrategia es el **framework Zero-Drift**, disenado para que el diseno no se desvie del objetivo de negocio ni de la evidencia. Comercialmente, se resume en cinco pilares:

- **Comite de Gobierno + 3 Celulas.** Un comite (direccion, gestion y calidad) gobierna tres celulas especializadas (Discovery, Diseno, Valor y Habilitacion).
- **7 fases con Quality Gates (QG-0..QG-6).** Ninguna fase avanza sin superar su gate; el veredicto es Go/No-Go.
- **RACI-V.** Cada entregable tiene Responsible, Accountable, Consulted, Informed y un **Verifier** explicito.
- **AICV-E.** Auditoria de Accuracy, Integrity, Congruence, Viability y Epistemic Certainty sobre cada entregable.
- **Hilo Dorado.** Trazabilidad continua Driver -> Capacidad -> Gap -> Reliever -> ABB -> SBB -> Historia -> ROI, sin eslabones rotos.

```mermaid
flowchart LR
    DRV["Drivers"] --> CAP["Capacidades"]
    CAP --> GAP["Gaps"]
    GAP --> REL["Relievers"]
    REL --> ABB["ABBs"]
    ABB --> SBB["SBBs"]
    SBB --> HU["Historias"]
    HU --> ROI["ROI / Caso de negocio"]
```

> El framework es **reutilizable** para cualquier cliente; Credi10 2.0 es solo el ejemplo de aplicacion de esta propuesta.

Este **reporte gerencial** es el soporte ejecutivo de la **propuesta comercial** de **Kulgops** ([`1-propuesta-comercial.md`](1-propuesta-comercial.md)). Resume, en lenguaje de negocio, el alcance del proyecto Credi10 2.0, las fases de trabajo, el diagnostico de alto nivel que obtuvimos y la estrategia, los riesgos, las consideraciones y los prerrequisitos que la gerencia debe conocer para decidir.

Partimos de **18** documentos del corpus analizados sin muestreo (RFP, assessment WSO2/Studio F, diagramas de arquitectura y PDFs de proceso). De ese analisis concluimos que Credi10 2.0 **no es un proyecto de features nuevas, sino de modernizacion y gobierno**: el negocio funciona, pero su plataforma esta **fragmentada, acoplada a un ERP legado por mecanismos fragiles y sobre runtimes obsoletos**, lo que limita disponibilidad, eficiencia y evolucion.

El valor de nuestra intervencion es dejar el proyecto **listo para estimar y construir** con trazabilidad completa desde cada indicador de negocio del RFP hasta una historia de usuario accionable. El detalle tecnico que respalda cada afirmacion vive en el **informe tecnico** ([`3-informe-tecnico/README.md`](3-informe-tecnico/README.md)).

## 2. Alcance comercial del proyecto

El servicio contratado es una **consultoria de advisory + especificacion de requisitos**. En terminos comerciales, lo que la gerencia recibe al cierre es un **paquete de decision**: el diagnostico del estado actual, el diseño objetivo, el backlog especificado, el plan de implementacion y la estimacion para presupuestar.

Universo de alcance de referencia: **17** modulos y **17** historias de usuario especificables, sin muestreo. La construccion se habilita con los entregables de esta etapa; no forma parte de ella.

## 3. Fases del proyecto (Zero-Drift)

El trabajo se organiza en **7 fases** con quality gates (QG-0..QG-6): ninguna fase avanza hasta superar su control de calidad, lo que evita el *scope drift* y mantiene la trazabilidad de punta a punta. Descripcion **comercial** de cada fase:

| --- | --- | --- | --- |
| Fase 0 | Higiene epistemica | Inventario trazable del corpus y registro honesto de supuestos, conflictos y vacios de informacion. | Arranca el proyecto sin fabricar evidencia: lo que no se sabe se declara, no se inventa. |
| Fase 1 | Contexto AS-IS | Radiografia del negocio y la tecnologia actuales: capacidades, procesos, inventario e indicadores de partida. | Fija la linea base contra la que se mide el retorno del proyecto. |
| Fase 2 | Estado del arte | Benchmarks de industria y patrones de referencia conectados a las capacidades del negocio. | Asegura que el rediseño se apoya en practicas probadas, no en opiniones. |
| Fase 3 | Gaps y viabilizacion | Diagnostico de brechas priorizadas y aliviadores para cerrarlas. | Convierte los dolores en un plan de accion viable y justificado. |
| Fase 4 | Diseño TO-BE y specs | Arquitectura objetivo, historias de usuario y especificaciones listas para construir. | Deja el proyecto listo para estimar y desarrollar con minima ambiguedad. |
| Fase 5 | Roadmap, estimacion y RAID | Plan por olas, estimacion recalibrable y registro de riesgos, supuestos, incidencias y dependencias. | Hace predecible la ejecucion y transparente la inversion. |
| Fase 6 | Caso de negocio | Retorno cuantificado contra los indicadores del RFP y veredicto de inversion del Comite. | Conecta cada peso invertido con un resultado de negocio medible. |

### 4.1 Hallazgos clave

Los hallazgos (resumen de la Fase 3) se concentran en cinco frentes reales, todos evidenciados en el assessment WSO2/Studio F y los diagramas de arquitectura:

| Hallazgo | Diagnostico de alto nivel | Driver RFP afectado | Severidad |
| --- | --- | --- | --- |
| GAP-001 | Integracion rigida con el ERP Siesa (archivos planos + un unico Web Service, en su mayoria batch con intervencion manual) | DRV-002 (60% -> 80%) | Alta |
| GAP-002 | Lectura/escritura directa a la base de datos del ERP Siesa, una practica de ALTO RIESGO para la integridad de datos | DRV-001 (90% -> 99%) | Critica |
| GAP-003 | Datos fragmentados: +200 bases de datos duplicadas e inconsistentes con controles manuales en Excel | DRV-002 (60% -> 80%) | Alta |
| GAP-004 | Ausencia de gobernanza de APIs y observabilidad: integraciones dispersas sin trazabilidad de errores | DRV-004 (50% -> 100%) | Media |
| GAP-005 | Obsolescencia tecnologica: .NET Framework 4.8 / .NET Core 3.1 fuera de soporte y Wordpress/XAMPP en produccion | DRV-005 (70% -> 100%) | Alta |

En palabras de negocio: la **fragmentacion arquitectonica** y la **falta de gobernanza de APIs** encarecen cada cambio; el **acople al ERP Siesa/UnoEE** por archivos planos, un unico Web Service y lectura directa a su base de datos es el **riesgo mas severo** (puede corromper datos del ERP); la **deuda tecnica** de +200 bases de datos duplicadas resta confianza a la informacion; y la **obsolescencia de .NET Framework 4.8 / .NET Core 3.1** compromete soporte, seguridad y licenciamiento.

> **Base de evidencia reforzada.** 5 de 5 documentos clave que antes eran **vacios epistemicos** (entre ellos el **Assessment WSO2/Studio F** y las especificaciones de **originacion**, **cartera**, **pagos** e **integracion de atencion al cliente**) fueron **recuperados como texto verificado** ([VERIFIED-FACT]) y hoy aportan evidencia trazable (**60** hechos clave). En consecuencia, estos hallazgos ya **no descansan en supuestos**. El detalle del cambio y su lectura de suficiencia estan en el informe tecnico (Anexo C - 'En que cambio').

<script type="text/plain" class="md-doc" data-doc-id="d-fase-0-higiene-epistemica-corpus-y-trazabilidad"># Corpus, trazabilidad y cobertura de evidencia

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 0 - Higiene Epistemica**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../00-higiene-epistemica.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

## Que estamos mirando y por que importa

Antes de analizar nada, el advisory establece la **higiene epistemica**: que sabemos, con que evidencia y con que grado de confianza. Se ingirio **18** documentos (RFP, assessment WSO2/Studio F y los tres diagramas de arquitectura) de forma COMPLETA y sin muestreo, y cada afirmacion que entra al analisis queda anclada a su documento fuente con su huella `sha256`. Esta disciplina no es burocracia: es el cimiento de una estimacion defendible. Un advisory que no distingue hecho de supuesto termina estimando sobre arena, y es exactamente ese riesgo el que esta fase elimina antes de que cueste caro.

La consecuencia practica es que **la calidad de la evidencia se convierte en un parametro de la estimacion**: los frentes sustentados por evidencia fuerte se pueden tallar con confianza, mientras que los frentes sustentados por PDFs de proceso que son mayormente imagen arrastran una contingencia explicita. Mirar el corpus con honestidad es, por tanto, el primer acto de gestion de riesgo del proyecto.

### Lectura analitica de la clasificacion

La tabla cuenta una historia: el **stack tecnologico y la topologia** (componentes .NET, bases SQL Server, infraestructura AWS, integraciones de contexto) estan bien soportados por los diagramas y se etiquetan [VERIFIED-FACT], mientras que casi todo lo **cuantitativo de negocio** (lineas base de disponibilidad, costos, volumetria de integraciones) cae en [EPISTEMIC-VOID]. Esa asimetria es decisiva: podemos estimar el **esfuerzo de construccion** con relativa confianza, pero NO podemos todavia comprometer el **retorno economico** sin cerrar los vacios. La estimacion honesta separa esas dos cosas.

## Supuestos y vacios que marcan el ritmo del proyecto

Los vacios y supuestos no se ocultan: se vuelven una **agenda de elicitacion** con responsable asignado. Cada pregunta abierta que no se cierra a tiempo es una fuente potencial de retrabajo y, por tanto, de desfase de cronograma.

## Implicaciones para la estimacion

La higiene epistemica fija el **nivel de confianza** de cada cifra aguas abajo. Donde la evidencia es fuerte, la talla T-Shirt se puede comprometer; donde hay [EPISTEMIC-VOID] (p. ej. la linea base del 90% de disponibilidad o el contrato real del Web Service de Siesa), la estimacion carga una **contingencia explicita** y se marca [DOC-ASSUMPTION]. Sin esta fase la estimacion pareceria mas precisa de lo que realmente es, que es el peor error posible.

## Implicaciones para la estrategia de implementacion

La estrategia de implementacion arranca por **cerrar deltas**: las preguntas de la agenda de elicitacion (DEL-01..DEL-06) deben resolverse en el arranque, porque condicionan el alcance real. En particular, el conflicto de alcance Studio F vs. Credi10 (DEL-03) define cuanto del universo entra en el proyecto y, por tanto, el tamanio de todas las olas.

## Riesgos e incertidumbre

El riesgo dominante de esta fase es el **riesgo de alcance**: si el conflicto +150 apps / +200 BDs (nivel grupo) vs. ~20 componentes (Credi10) no se resuelve, cualquier estimacion puede desviarse por un factor grande. Se mitiga tratando el delta como prerrequisito duro antes de comprometer fechas. [DOC-CONFLICT]

<script type="text/plain" class="md-doc" data-doc-id="d-fase-0-higiene-epistemica-grafo-de-conceptos"># Grafo de conceptos y modelo mental del ecosistema

### Que nos dice el grafo

El grafo evidencia una **arquitectura centrada en un nucleo .NET** del que cuelgan integradores y workers, con el ERP Siesa y los buros como dependencias externas criticas. No hay una capa de integracion gobernada: cada flecha es una integracion punto a punto. Esa topologia es precisamente la que la Fase 3 convertira en gaps y la Fase 4 en building blocks de solucion.

### Centros de gravedad del ecosistema

| Bases de datos SQL Server | Persistencia | Dispersion/duplicacion a nivel grupo (consolidacion pendiente) |
## Implicaciones para la estimacion

El grado de acoplamiento visible en el grafo es un **predictor de esfuerzo**: cuantas mas flechas convergen en un nodo (Siesa, buros), mayor el costo de desacoplarlo con seguridad. El modelo mental permite anticipar que MOD-16 (integracion Siesa) sera el modulo mas pesado, algo que la Fase 5 confirma con talla XL.

## Implicaciones para la estrategia de implementacion

La estrategia se ordena alrededor de los centros de gravedad del grafo: primero una capa de integracion gobernada y el desacople de Siesa, luego los dominios que dependen de ella. El grafo justifica por que los enablers van al inicio del roadmap.

## Riesgos e incertidumbre

El riesgo es subestimar el efecto domino de un nodo central: tocar Siesa sin un contrato claro puede propagar fallos a originacion, pagos y cartera. El grafo hace ese riesgo visible y, por tanto, gestionable. [DOC-ASSUMPTION]

<script type="text/plain" class="md-doc" data-doc-id="d-fase-1-contexto-as-is-contexto-negocio"># Contexto de negocio: drivers y capacidades

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 1 - Contexto AS-IS**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../01-contexto-as-is.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

El contexto de negocio ancla todo el advisory en los **cinco indicadores de retorno del RFP** (disponibilidad 90% -> 99%, eficiencia 60% -> 80%, costo de infraestructura 80% -> 80%, evolucion/escalamiento 50% -> 100% y licenciamiento 70% -> 100%). Estos drivers no son adorno: son los criterios contra los que se juzgara el exito del proyecto y, por tanto, el norte que ordena la priorizacion. Cada capacidad de negocio (originacion, desembolso, pagos, cartera, cobranza, canales, integracion) se cuelga de un driver, de modo que el esfuerzo tecnico siempre responde a un 'para que' de negocio.

Entender esta jerarquia es lo que permite estimar con criterio: no todas las capacidades valen lo mismo, y el valor de negocio de cada una (via su driver) es el numerador del WSJF que la Fase 5 usa para secuenciar las olas.

## Drivers estrategicos (indicadores del RFP)

| Hilo Dorado | Indicador de retorno (RFP) | AS-IS -> TO-BE | Driver estrategico |
| --- | --- | --- | --- |
| DRV-001 | Disponibilidad de apps/servicios criticos | 90% -> 99% | Elevar la disponibilidad de la plataforma Credi10 y sus componentes criticos. |
| DRV-002 | Optimizacion/eficiencia de recursos | 60% -> 80% | Mejorar la eficiencia operativa reduciendo procesos manuales y batch. |
| DRV-003 | Optimizacion de costo de infraestructura | 80% -> 80% | Sostener el costo de infraestructura sin degradar servicio al escalar. |
| DRV-004 | Evolucion tecnologica y escalamiento | 50% -> 100% | Modernizar el stack obsoleto y habilitar escalamiento elastico. |
| DRV-005 | Cumplimiento de licenciamiento | 70% -> 100% | Cerrar brechas de licenciamiento del stack .NET/SQL Server/Wordpress. |

### Interpretacion de los drivers

Dos drivers son de **continuidad** (disponibilidad y eficiencia) y pesan sobre la operacion diaria; dos son de **evolucion** (escalamiento y licenciamiento) y pesan sobre la sostenibilidad; uno es de **disciplina de costo**. La estimacion debe equilibrar ambos mundos: entregar continuidad temprano (para capturar valor rapido) sin hipotecar la evolucion. El indicador de costo 80% -> 80% es revelador: no se pide ahorrar, se pide **no degradar el costo al escalar**, lo que empuja hacia practicas FinOps desde el diseno.

<script type="text/plain" class="md-doc" data-doc-id="d-fase-1-contexto-as-is-deuda-tecnica"># Deuda tecnica y riesgos del AS-IS

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 1 - Contexto AS-IS**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../01-contexto-as-is.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

La deuda tecnica del AS-IS no es una lista de quejas: es el **motor del caso de negocio**. Cada item de deuda (runtime obsoleto, lectura directa a la BD del ERP, Wordpress en produccion, integraciones dispersas, +200 BDs duplicadas) se traduce mas adelante en un gap, un reliever y un bloque de solucion. Interpretar la deuda es, en realidad, dimensionar el trabajo de modernizacion.

El hilo narrativo con la fase anterior es directo: la higiene epistemica verifico estas practicas de alto riesgo como hechos [VERIFIED-FACT]; aqui las ordenamos por impacto en los drivers para que la priorizacion sea defendible.

## Catalogo de deuda tecnica

| ID | Deuda / obsolescencia tecnica | Riesgo | Driver impactado |
| --- | --- | --- | --- |
| DT-01 | .NET Framework 4.8 en plataforma e integradores | Marco legado, sin evolucion de features; riesgo de soporte | DRV-004, DRV-005 |
| DT-02 | .NET Core 3.1 en Link de Recaudo | Fuera de soporte (end-of-life) | DRV-004, DRV-005 |
| DT-03 | Wordpress + XAMPP/Apache en produccion | Superficie de ataque y operacion fragil para un canal B2C | DRV-001, DRV-004 |
| DT-04 | Lectura/escritura directa a la BD del ERP Siesa | Acoplamiento fuerte y riesgo de integridad de datos | DRV-002 |
| DT-05 | Integraciones dispersas en Windows Services/cronjobs sin gestion centralizada ni trazabilidad de errores | Baja gobernanza, intervencion manual | DRV-002, DRV-004 |
| DT-06 | +200 bases de datos duplicadas con controles manuales en Excel (nivel grupo) | Inconsistencia de datos | DRV-002 |

### De la deuda a la decision

La deuda de **acceso directo a la BD del ERP Siesa** (DT-04) es la mas peligrosa porque combina alto riesgo de integridad con alto acoplamiento; por eso el TO-BE la prohibe explicitamente (ADR-002). La obsolescencia de runtime (DT-01, DT-02) es la mas extensa en esfuerzo porque toca muchos componentes. Esta distincion riesgo vs. esfuerzo es la que permite secuenciar: primero lo peligroso, luego lo extenso.
## Implicaciones para la estimacion

Cada item de deuda se convierte en un multiplicador de esfuerzo en la estimacion por modulo (factor de acople legado = 1,20 en la tabla parametrica de la Fase 5). La deuda es, literalmente, un parametro de la ecuacion de estimacion.

## Implicaciones para la estrategia de implementacion

La estrategia prioriza por **riesgo x impacto en drivers**: las practicas de alto riesgo (BD directa, Wordpress en produccion) se atacan en las primeras olas aunque su esfuerzo sea moderado, porque su costo de inaccion es alto.

## Riesgos e incertidumbre

El meta-riesgo es que la deuda tecnica crezca mas rapido de lo que se paga. Por eso el roadmap intercala modernizacion con entrega de valor y no la pospone al final.

<script type="text/plain" class="md-doc" data-doc-id="d-fase-1-contexto-as-is-ecosistema-tecnologico"># Ecosistema tecnologico y de datos AS-IS

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

El inventario tecnologico y de datos es la **radiografia del terreno** sobre el que se construira. Credi10 corre sobre .NET Framework 4.8 e IIS, con integradores en .NET, Link de Recaudo en .NET Core 3.1, workers mixtos y un canal B2C sobre Node.js/React y Wordpress/XAMPP. Los datos viven en SQL Server 2019 Enterprise y MariaDB. Conocer cada pieza con precision es lo que convierte una estimacion en algo mas que una corazonada.

La lectura narrativa es que conviven **dos generaciones tecnologicas**: componentes modernos (.NET 8 en algunos workers) junto a marcos fuera de soporte (.NET 4.8, .NET Core 3.1, Wordpress). Esa heterogeneidad encarece el mantenimiento y es el corazon del driver de evolucion (DRV-004) y licenciamiento (DRV-005).

## Implicaciones para la estimacion

El inventario permite tallar el esfuerzo de **migracion de runtime** (cuantos componentes salen de .NET 4.8 / Core 3.1) y de **consolidacion de datos**. Ambos frentes se marcan con factores de acople legado en la tabla parametrica de la Fase 5.

El riesgo es la **deuda tecnica oculta**: esquemas de datos no documentados y dependencias implicitas entre componentes legados. Se mitiga con un inventario y clasificacion previos como prerrequisito. [DOC-ASSUMPTION]

<script type="text/plain" class="md-doc" data-doc-id="d-fase-1-contexto-as-is-procesos-bpmn"># Procesos de negocio AS-IS (BPMN) y metricas base

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 1 - Contexto AS-IS**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../01-contexto-as-is.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

El flujo operativo real de Credi10 va de la **originacion** al **estudio de credito** (CrossCore -> Inspektor -> Datacredito/Dictum), luego **desembolso** (RCL/RCR en UnoEE, timbrado Numrot), **pagos/recaudo** (Link de Recaudo -> PayU), **corte de cartera** y **cobranza omnicanal**. Mapear este proceso extremo a extremo es indispensable porque **el proceso es la unidad de valor**: la estimacion y el roadmap se organizan alrededor de tramos de este flujo, no de componentes sueltos.

La narrativa clave es que el proceso esta encadenado: una interrupcion en el estudio de credito paraliza el desembolso y, aguas abajo, el recaudo. Esa dependencia secuencial explica por que la disponibilidad (DRV-001) es tan critica y por que el desacople de las integraciones es el enabler que desbloquea todo.

## Proceso BPMN AS-IS (extremo a extremo)

```mermaid
flowchart LR
    A([Cliente / solicitud]) --> B[Captura y originacion]
    B --> C{Estudio de credito}
    C --> C1[CrossCore]
    C1 --> C2[Inspektor]
    C2 --> C3[Datacredito / Dictum]
    C3 --> D{Decision}
    D -- Aprobado --> E[Desembolso<br/>RCL/RCR UnoEE + Numrot]
    D -- Rechazado --> X([Fin])
    E --> F[Pagos y recaudo<br/>Link Recaudo -> PayU]
    F --> G[Corte y gestion de cartera]
    G --> H{Mora?}
    H -- Si --> I[Cobranza omnicanal<br/>SMS/WhatsApp/Email + WOLKVOX]
    H -- No --> X
    I --> X
```


### Lectura del flujo

El diagrama muestra un proceso lineal con una bifurcacion de decision (aprobado/rechazado) y un ciclo de cobranza. Los puntos de mayor riesgo operativo son las **llamadas sincronas a buros** (si uno cae, se detiene el estudio) y la **escritura a Siesa** en el desembolso. Ambos se convierten en requisitos no funcionales de resiliencia en el TO-BE.

## Metricas baseline AS-IS

| Cadena de valor | Metrica baseline (AS-IS) | Fuente | Driver |
| --- | --- | --- | --- |
| Disponibilidad plataforma | 90% (objetivo RFP 99%) | RFP | DRV-001 |
| Eficiencia de recursos | 60% (objetivo 80%) | RFP | DRV-002 |
| Evolucion/escalamiento | 50% (objetivo 100%) | RFP | DRV-004 |
| Cumplimiento licenciamiento | 70% (objetivo 100%) | RFP | DRV-005 |
| Estudio de credito | Encadenado CrossCore->Inspektor->Dictum (latencia no instrumentada) [EPISTEMIC-VOID] | Diagrama Contexto | CAP-001 |
| Integracion ERP Siesa | Batch por archivos planos + WS unico; errores con intervencion manual | Assessment WSO2 | CAP-007 |

### Que falta medir

Las metricas confirman los objetivos del RFP pero exponen un vacio: la **latencia del estudio de credito no esta instrumentada** [EPISTEMIC-VOID]. No se puede mejorar lo que no se mide, asi que instrumentar observabilidad es un prerrequisito, no un lujo.
## Implicaciones para la estimacion

Estimar por tramos del proceso (originacion, estudio, desembolso, recaudo, cartera, cobranza) da una descomposicion natural que se mapea a los modulos MOD-xx de la Fase 5. La ausencia de metricas de latencia obliga a estimar algunos NFR con [DOC-ASSUMPTION] y contingencia.

## Implicaciones para la estrategia de implementacion

La estrategia respeta el orden del proceso pero inserta primero los enablers transversales (observabilidad, integracion gobernada) para no reconstruir cada tramo sobre bases inestables.

## Riesgos e incertidumbre

El riesgo operativo es la **propagacion de fallos** por el encadenamiento sincrono del proceso. El TO-BE lo mitiga con eventos y resiliencia; mientras tanto, cualquier ola debe preservar la continuidad del flujo (restriccion del RFP).

</script>

<script type="text/plain" class="md-doc" data-doc-id="d-fase-2-estado-del-arte-benchmarks"># Benchmarks de industria y comparativo AS-IS

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 2 - Estado del Arte**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../02-estado-del-arte.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

El estado del arte conecta la realidad de Credi10 con los **patrones de referencia** del credito de consumo y fintech: integracion API-led con gestion centralizada de APIs (eco directo de la recomendacion del assessment WSO2), arquitectura event-driven, cloud-native, observabilidad/SRE, zero-trust y automatizacion/IA. El valor de esta fase es que **evita reinventar la rueda**: cada gap se medira contra una practica reconocida, lo que da credibilidad y reduce la incertidumbre de la estimacion.

La narrativa es de brecha: el comparativo AS-IS vs. estado del arte muestra que Credi10 esta lejos del patron en integracion y datos, y mas cerca en seguridad perimetral. Esa distancia es, en esencia, el trabajo por hacer, y ordenarla por tamanio de brecha ayuda a priorizar.

## Benchmarks ligados al Hilo Dorado

| Hilo Dorado | Benchmark / patron de industria | Capacidad / Driver | Relevancia para Credi10 |
| --- | --- | --- | --- |
| BMK-001 | Integracion API-led (API gateway + management) | CAP-007 / DRV-004 | Gestionar todas las APIs de forma centralizada (eco directo de la recomendacion 5.2 del assessment: WSO2 API Platform + Integration Platform) frente a integraciones dispersas en Windows Services. |
| BMK-002 | Arquitectura event-driven / mensajeria | CAP-002 / DRV-002 | Reemplazar batch por archivos planos del ERP Siesa con eventos/colas para sincronizacion casi en tiempo real. |
| BMK-003 | Cloud-native / contenedores y escalamiento elastico | CAP-006 / DRV-004 | Contenerizar workloads y escalar en AWS (us-east-2) con autoscaling en lugar de EC2 estaticos Coatlanta/Codallas/Comumbai. |
| BMK-004 | Observabilidad y alta disponibilidad (SRE) | CAP-003 / DRV-001 | Instrumentar disponibilidad y SLOs para sustentar el salto 90% -> 99%. |
| BMK-005 | Zero-trust y seguridad por diseno | CAP-007 / DRV-005 | Fortalecer WAF/ALB/VPN IPSec con identidad, segmentacion y cifrado extremo a extremo. |
| BMK-006 | Automatizacion / IA en originacion y cobranza | CAP-001 / DRV-002 | Scoring asistido y cobranza omnicanal inteligente sobre el flujo CrossCore/Inspektor/Datacredito y WOLKVOX. |

## Comparativo AS-IS vs. estado del arte

| Dimension | Credi10 AS-IS | Patron de industria (estado del arte) | Brecha |
| --- | --- | --- | --- |
| Integracion | WS unico + archivos planos + lectura directa a BD del ERP | API-led connectivity con API gateway/management (WSO2) | Alta |
| Datos | +200 BDs duplicadas, controles en Excel (nivel grupo) | Fuente unica de verdad, data products, CDC | Alta |
| Despliegue | .NET Framework 4.8 / .NET Core 3.1 sobre IIS y EC2 estaticos | Cloud-native, contenedores, autoscaling | Media-Alta |
| Disponibilidad | 90% sin instrumentacion formal | SRE con SLOs/error budgets (99%+) | Alta |
| Seguridad | WAF + ALB + VPN IPSec perimetral | Zero-trust, identidad y microsegmentacion | Media |
| Canales | Portal B2C Wordpress/XAMPP + VTEX + B2CHAT | Experiencia digital componible (MACH) | Media |

### Donde esta la brecha mas grande

Las brechas 'Alta' se concentran en **integracion** y **datos**, que son justamente los frentes que la Fase 3 convierte en los gaps de mayor costo de inaccion. La brecha en disponibilidad es alta por falta de instrumentacion, no necesariamente por mala arquitectura: se cierra con observabilidad antes que con grandes rediseños.
## Implicaciones para la estimacion

Anclar cada frente a un benchmark conocido permite usar **referencias de industria** para calibrar el esfuerzo, reduciendo la incertidumbre frente a estimar en el vacio. Los frentes con brecha 'Alta' concentran el grueso de los story points.

## Implicaciones para la estrategia de implementacion

La estrategia adopta API-led connectivity como columna vertebral: primero la plataforma de gestion de APIs, luego los dominios. El comparativo justifica por que ese orden maximiza el cierre de brechas por unidad de esfuerzo.

## Riesgos e incertidumbre

El riesgo es adoptar patrones por moda y no por ajuste al problema. El posicionamiento Hype Cycle (abajo) mitiga esto marcando que adoptar ya y que solo pilotar. [DOC-ASSUMPTION]

<script type="text/plain" class="md-doc" data-doc-id="d-fase-2-estado-del-arte-tendencias-y-referencia"># Radar de tendencias y modelo de referencia sectorial

## Que estamos mirando y por que importa

El hilo con la fase siguiente es que este modelo de referencia es el molde del que la Fase 4 saca los Solution Building Blocks: Experience / Process / System APIs se vuelven servicios concretos.

### Como se usa el modelo de referencia

El modelo separa **Experience APIs** (canales), **Process APIs** (dominios de credito) y **System APIs** (ERP, buros, PayU, datos). Esta separacion por capas es la que permite estimar por dominio y desacoplar la evolucion de los canales de la del core, un principio clave para no bloquear al negocio durante la transformacion.

El modelo de referencia da una **taxonomia estable** para descomponer el alcance en capas y dominios, lo que hace la estimacion mas repetible y auditable. Lo que se pilota (IA generativa) se estima como spikes acotados, no como alcance firme.

La secuencia adopta primero lo maduro (API management, observabilidad), luego event-driven y cloud-native, y deja zero-trust e IA para horizontes posteriores. Asi el esfuerzo se concentra donde el retorno es mas seguro.

El riesgo es el 'gold-plating': construir para tendencias que el negocio aun no necesita. El posicionamiento por horizonte y el WSJF de la Fase 5 contienen ese riesgo. [DOC-ASSUMPTION]

<script type="text/plain" class="md-doc" data-doc-id="d-fase-3-gaps-y-viabilizacion-gap-analysis"># Matriz de dolores, causas raiz y gap analysis

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 3 + 3.5 - Gaps y Viabilizacion**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../03-gaps-y-viabilizacion.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

Aqui el advisory pasa del diagnostico al **caso de cambio**. Los dolores del assessment WSO2/Studio F se convierten en gaps cuantificables (GAP-001..005), cada uno con su causa raiz y su costo de inaccion, y se ligan a un indicador del RFP. Este es el pivote narrativo del informe: todo lo que vimos en el AS-IS cristaliza en una lista acotada de problemas que el proyecto debe resolver, y esa lista es la base del alcance y de la estimacion.

Importa porque **un gap bien definido es un trozo de alcance estimable**. El gap analysis multidominio (TOGAF B/C/D) asegura que no se nos escape ninguna dimension (negocio, datos, aplicacion, tecnologia), de modo que la estimacion sea completa y no solo tecnica.

## Matriz cuantificada de dolores y costo de inaccion

| Hilo Dorado | Dolor (assessment WSO2/Studio F) | Causa raiz | Costo de Inaccion (COI) | Driver | Benchmark |
| --- | --- | --- | --- | --- | --- |
| GAP-001 | Integracion rigida con Siesa (archivos planos + WS unico, batch, errores con intervencion manual) | WS unico como cuello de botella; acoplamiento punto a punto | Sobrecosto operativo por reprocesos manuales y demoras batch [DOC-ASSUMPTION] | DRV-002 | BMK-001 |
| GAP-002 | Lectura/escritura directa a la BD del ERP Siesa (practica de ALTO RIESGO) | El WS unico no soporta la carga; se evade el contrato | Riesgo de corrupcion de datos del ERP e indisponibilidad [DOC-ASSUMPTION] | DRV-001 | BMK-002 |
| GAP-003 | +200 BDs duplicadas/inconsistentes, logica repetida y controles manuales en Excel | Ausencia de fuente unica de verdad y de dominios de datos | Horas-hombre en conciliacion manual y errores de datos [DOC-ASSUMPTION] | DRV-002 | BMK-002 |
| GAP-004 | Apps .NET desordenadas, integraciones dispersas en Windows Services/cronjobs sin gestion centralizada ni trazabilidad | Falta de plataforma de API Management y observabilidad | Incidentes sin trazabilidad y MTTR elevado [DOC-ASSUMPTION] | DRV-004 | BMK-001 |
| GAP-005 | Obsolescencia .NET Framework 4.8 / .NET Core 3.1 (EOL) y Wordpress/XAMPP en produccion | Falta de ciclo de modernizacion y de cumplimiento de licenciamiento | Riesgo de soporte, seguridad y multas de licenciamiento [DOC-ASSUMPTION] | DRV-005 | BMK-003 |

### Lectura de la matriz

Los dos gaps de **integracion con Siesa** (GAP-001 integracion rigida y GAP-002 lectura directa a la BD) tienen el mayor costo de inaccion porque bloquean el proceso completo y arriesgan la integridad de los datos. GAP-003 (datos inconsistentes) y GAP-004 (falta de gobierno) erosionan la confianza y la eficiencia. GAP-005 (obsolescencia) es riesgo latente de soporte y seguridad. Esta jerarquia de dolor es la que ordena las primeras olas.

## Gap analysis multidominio (TOGAF B/C/D)

### Dominio B - Negocio

| Gap | Dominio B (Negocio) | AS-IS -> TO-BE | Indicador RFP |
| --- | --- | --- | --- |
| GAP-003 | Desconfianza del usuario y controles manuales en Excel | Procesos con fuente unica de verdad | DRV-002 (60% -> 80%) |
| GAP-001 | Procesos batch con intervencion manual (Siesa) | Procesos sincronizados y automatizados | DRV-002 (60% -> 80%) |
| GAP-004 | Reglas de negocio duplicadas y dispersas | Reglas centralizadas y preservadas (requisito RFP) | DRV-004 (50% -> 100%) |

### Dominio C - Datos y Aplicacion

| Gap | Dominio C (Datos) | AS-IS -> TO-BE | Indicador RFP |
| --- | --- | --- | --- |
| GAP-003 | +200 BDs duplicadas/inconsistentes | Dominios de datos con fuente unica de verdad | DRV-002 (60% -> 80%) |
| GAP-002 | Acceso directo a la BD del ERP Siesa | Data Services gobernados sobre el ERP | DRV-001 (90% -> 99%) |

| Gap | Dominio C (Aplicacion) | AS-IS -> TO-BE | Indicador RFP |
| --- | --- | --- | --- |
| GAP-004 | Apps .NET desordenadas con funciones duplicadas | Servicios de dominio desacoplados tras un API Gateway | DRV-004 (50% -> 100%) |
| GAP-001 | WS unico monolitico para todas las operaciones | APIs estandarizadas por dominio + bus de eventos | DRV-002 (60% -> 80%) |

### Dominio D - Tecnologia

| Gap | Dominio D (Tecnologia) | AS-IS -> TO-BE | Indicador RFP |
| --- | --- | --- | --- |
| GAP-005 | .NET Framework 4.8 / .NET Core 3.1 (EOL) | Runtime .NET 8 contenerizado | DRV-005 (70% -> 100%) |
| GAP-005 | Wordpress/XAMPP en produccion | Canal B2C modernizado y hardenizado | DRV-004 (50% -> 100%) |
| GAP-002 | EC2 estaticos y WS lento | Cloud-native con escalamiento y costo controlado | DRV-003 (80% -> 80%) |
## Implicaciones para la estimacion

Cada gap es una unidad de alcance con un indicador asociado; estimar el proyecto es, en primera aproximacion, estimar el cierre de GAP-001..005. El costo de inaccion (aunque marcado [DOC-ASSUMPTION] por falta de cifras reales) permite priorizar por valor, no solo por esfuerzo.

## Implicaciones para la estrategia de implementacion

La estrategia secuencia el cierre de gaps por dependencia tecnica: no se puede cerrar GAP-002 (BD directa) sin antes habilitar la capa de integracion gobernada que resuelve GAP-001/004. Esa logica define el orden de las olas.

## Riesgos e incertidumbre

El riesgo es cerrar un gap y abrir otro (p. ej. desacoplar Siesa sin preservar las reglas de negocio). La matriz de excepciones y los relievers trazables contienen ese riesgo.

</script>
<script type="text/plain" class="md-doc" data-doc-id="d-fase-3-gaps-y-viabilizacion-reglas-y-nfr"># Reglas de negocio, excepciones y NFR base

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 3 + 3.5 - Gaps y Viabilizacion**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../03-gaps-y-viabilizacion.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

Preservar las **reglas de negocio** (RN-01..04) es un requisito duro del RFP, y la matriz de excepciones (Exception Storming) captura los casos borde del flujo de credito antes de diseñar. Junto con el perfil base de NFR (ISO 25010) y los limites de integracion legada, esta seccion define **que no puede romperse** durante la transformacion.

La narrativa de calidad es central: las excepciones y los NFR son donde los proyectos subestiman esfuerzo. Hacerlos explicitos aqui evita la sorpresa clasica de 'el happy path estaba, pero los casos borde duplicaron el trabajo'.

## Reglas de negocio a preservar

| Regla | Descripcion | Preservacion (requisito RFP) |
| --- | --- | --- |
| RN-01 | El estudio de credito encadena CrossCore, luego Inspektor y finalmente Datacredito/Dictum antes de decidir | Preservar regla existente [VERIFIED-FACT] |
| RN-02 | Una solicitud rechazada en cualquier buro detiene el flujo | Preservar regla existente |
| RN-03 | El desembolso genera RCL/RCR en UnoEE y se timbra con Numrot | Preservar regla existente |
| RN-04 | El recaudo solo se marca aplicado tras confirmacion de PayU | Preservar regla existente |

## Matriz de excepciones (Exception Storming)

| ID | Evento / caso borde (flujo estudio de credito) | Causa | Respuesta esperada TO-BE |
| --- | --- | --- | --- |
| EX-01 | CrossCore no responde o agota timeout | Indisponibilidad del buro | Reintento con backoff; si persiste, encolar y notificar sin perder la solicitud |
| EX-02 | Inspektor devuelve datos incompletos | Respuesta parcial del servicio | Marcar estudio como pendiente de revision manual, no aprobar |
| EX-03 | Datacredito/Dictum reporta no-hit | Cliente sin historial | Aplicar regla de negocio alterna de scoring, registrar [DOC-ASSUMPTION] |
| EX-04 | Escritura a Siesa falla (WS lento o caido) | Limite del WS unico | Publicar evento y reintentar via Data Services; nunca escribir directo a la BD del ERP |
| EX-05 | Solicitud duplicada del mismo cliente | Reenvio o doble clic | Idempotencia por clave de solicitud; rechazar duplicado |

### Por que las excepciones mueven la aguja

Cada excepcion (buro caido, respuesta parcial, no-hit, fallo de escritura a Siesa, duplicados) es trabajo real de resiliencia e idempotencia que rara vez cabe en una estimacion ingenua. Catalogarlas desde la Fase 3 permite que la estimacion por modulo las incluya en lugar de descubrirlas en construccion.

## Perfil base de NFR y limites legacy

| Caracteristica ISO 25010 | NFR base | Objetivo | Driver |
| --- | --- | --- | --- |
| Fiabilidad (disponibilidad) | Disponibilidad de servicios criticos | 90% -> 99% | DRV-001 |
| Eficiencia de desempenio | Latencia del estudio de credito y recaudo | Instrumentar SLOs (hoy sin medicion) [EPISTEMIC-VOID] | DRV-002 |
| Mantenibilidad | Reglas de negocio centralizadas y sin duplicar | Reducir logica duplicada | DRV-004 |
| Seguridad | Zero-trust, cifrado y trazabilidad de errores | Cerrar brechas de gobernanza | DRV-005 |
| Portabilidad | Runtime contenerizado .NET 8 | Cloud-native | DRV-004 |
| Compatibilidad | Integracion estandarizada (APIs + eventos) | Retirar archivos planos y WS unico | DRV-002 |

| Sistema legado | Limite de integracion | Impacto | Gap |
| --- | --- | --- | --- |
| ERP Siesa/UnoEE | Un UNICO Web Service para todas las operaciones | Cuello de botella y punto unico de falla | GAP-001 |
| ERP Siesa/UnoEE | Integraciones por archivos planos en modo batch | Falta de sincronizacion, latencia alta | GAP-001 |
| ERP Siesa/UnoEE | Lectura/escritura directa a la BD por lentitud del WS | Riesgo de integridad; acoplamiento a esquema | GAP-002 |
| Integraciones Windows/cronjobs | Sin gestion centralizada ni trazabilidad de errores | Incidentes opacos, MTTR alto | GAP-004 |
| Portal B2C | Wordpress/XAMPP en produccion | Superficie de ataque y operacion fragil | GAP-005 |
## Implicaciones para la estimacion

Los NFR y las excepciones son multiplicadores de esfuerzo: un modulo con muchos casos borde y NFR exigentes de disponibilidad se talla mas grande. El factor de riesgo de integracion (1,25) de la Fase 5 captura parte de este efecto.

## Implicaciones para la estrategia de implementacion

La estrategia introduce pruebas de **equivalencia funcional** para garantizar que las reglas RN-01..04 se preservan al modernizar, y trata los limites legacy (WS unico, batch) como fronteras a desacoplar de forma incremental (Strangler Fig).

## Riesgos e incertidumbre

El riesgo mayor es alterar inadvertidamente una regla de negocio al migrar. Se mitiga con una base de casos de prueba de equivalencia como prerrequisito (PRE-006). [DOC-ASSUMPTION]

</script>
<script type="text/plain" class="md-doc" data-doc-id="d-fase-3-gaps-y-viabilizacion-viabilizacion"># Aliviadores, bounded contexts y ABBs

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 3 + 3.5 - Gaps y Viabilizacion**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../03-gaps-y-viabilizacion.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

Los **aliviadores** (REL-001..004) responden a cada gap haciendo eco de las recomendaciones del assessment, y los **bounded contexts** (DDD) junto con los **ABBs** (Architecture Building Blocks) dan la primera forma arquitectonica a la solucion. Este es el puente entre el problema y el diseño: cada reliever apunta a un ABB que la Fase 4 convertira en un SBB concreto.

Para la estimacion, los bounded contexts son oro: delimitan **fronteras de equipo y de esfuerzo**. Un contexto bien acotado se puede asignar a un squad stream-aligned y estimar de forma relativamente independiente, lo que reduce el riesgo de estimaciones acopladas.

## Mapa de aliviadores

    R2 --> ABB2["ABB-002 Data Services Siesa"]
    R3 --> ABB1["ABB-001 API Gateway/Management"]
    R4 --> ABB6["ABB-006 Runtime .NET 8"]
```

| REL-004 | Revisar y reemplazar las aplicaciones candidatas y modernizar el stack legado (.NET Framework 4.8 / .NET Core 3.1 -> .NET 8; retirar Wordpress/XAMPP de produccion). | Rec. 5.3 del assessment | GAP-005 | DRV-005 |

| Termino (Lenguaje Ubicuo) | Definicion |

## Catalogo de ABBs

| Hilo Dorado | ABB (Architecture Building Block) | Reliever origen | Bounded Context |
| --- | --- | --- | --- |
| ABB-001 | API Gateway y plataforma de API Management centralizada | REL-003 | Integracion ERP / transversal |
| ABB-002 | Capa de Data Services sobre el ERP Siesa (reemplaza lectura directa a BD) | REL-002 | Integracion ERP |
| ABB-003 | Bus de eventos / mensajeria para sincronizacion casi en tiempo real | REL-001 | Integracion ERP / Pagos / Recaudo |
| ABB-004 | Servicios de dominio desacoplados (Originacion, Estudio de Credito, Pagos, Recaudo, Cartera, Cobranza) | REL-003 | Multidominio |
| ABB-005 | Plano de observabilidad y trazabilidad de errores (logging, metricas, SLOs) | REL-003 | Transversal |
| ABB-006 | Runtime modernizado .NET 8 contenerizado | REL-004 | Transversal / Despliegue |

### Del ABB al esfuerzo

Los ABBs transversales (API Gateway, Data Services, bus de eventos, observabilidad) son **enablers** que benefician a todos los dominios pero no entregan valor de negocio por si solos. Reconocerlos como enablers es clave para la estimacion: su esfuerzo se amortiza entre varios modulos y su ausencia bloquea el resto, por lo que van primero en el roadmap.
## Implicaciones para la estimacion

La descomposicion por bounded context es la base de la estimacion por modulo de la Fase 5: cada contexto agrupa modulos estimables por separado. Los ABBs enabler se estiman como inversion compartida.

## Implicaciones para la estrategia de implementacion

La estrategia entrega primero los ABBs enabler (integracion, observabilidad) y luego los dominios de negocio, respetando el lenguaje ubicuo para que el equipo y el negocio hablen el mismo idioma y no haya drift semantico.

## Riesgos e incertidumbre

El riesgo es que un enabler se retrase y arrastre a todos sus dependientes. Por eso el reverse briefing a la celula de diseño marca explicitamente las dependencias.

<script type="text/plain" class="md-doc" data-doc-id="d-fase-4-diseno-to-be-adrs"># Decisiones de arquitectura (ADRs)

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 4 - Diseno TO-BE**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../04-diseno-to-be.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

Los **ADR** (Architecture Decision Records) documentan las seis decisiones estructurales del TO-BE con su contexto, decision y consecuencias. Son el corazon de la trazabilidad arquitectonica: explican **por que** se eligio cada camino, lo que permite recalibrar con fundamento si el cliente prefiere una alternativa.

Para la estimacion, los ADR acotan el espacio de solucion y, por tanto, la varianza del esfuerzo: fijar WSO2, .NET 8, AWS y la prohibicion de acceso directo a la BD elimina ramas de incertidumbre que, de quedar abiertas, inflarian el rango de la estimacion.

## Resumen de decisiones (ADR)

| ADR | Decision | Gap que ataca | Impacto en esfuerzo/riesgo |
| --- | --- | --- | --- |
| ADR-001 | API Management centralizado (WSO2) | GAP-004 | Alto (plataforma transversal) |
| ADR-002 | Data Services + eventos sobre Siesa (sin BD directa) | GAP-001, GAP-002 | Muy alto (nucleo del acoplamiento) |
| ADR-003 | Migrar runtime a .NET 8 | GAP-005 | Alto (extension: muchos componentes) |
| ADR-004 | WSO2 vs. alternativas (recalibrable) | GAP-004 | Medio (fuente de varianza si cambia) |
| ADR-005 | Fuente unica de verdad por dominio | GAP-003 | Alto (consolidar +200 BDs) |
| ADR-006 | Estrategia cloud AWS | GAP-002 | Medio (IaC + FinOps) |

## Registro detallado de decisiones

### ADR-001: Adoptar una plataforma de API Management centralizada

- **Estado:** Aceptada.
- **Contexto:** Las integraciones viven dispersas en servicios de Windows y cronjobs sin gestion centralizada ni trazabilidad (GAP-004).
- **Decision:** Adoptar WSO2 API Platform + Integration Platform como capa unica de gestion de APIs (SBB-001), eco de la recomendacion 5.2 del assessment.
- **Consecuencias:** Gobernanza, trazabilidad y seguridad centralizadas; introduce una dependencia de plataforma a operar. Liga a DRV-004.

### ADR-002: Reemplazar la integracion de archivos planos / WS unico de Siesa por Data Services + eventos

- **Estado:** Aceptada.
- **Contexto:** Siesa se integra por archivos planos batch y un unico Web Service, con la practica de ALTO RIESGO de leer/escribir directo a la BD del ERP (GAP-001, GAP-002).
- **Decision:** Exponer el ERP Siesa como **Data Services** gobernados (SBB-002) y sincronizar via un **bus de eventos** (SBB-003); prohibir el acceso directo a la BD del ERP.
- **Consecuencias:** Elimina el cuello de botella y el riesgo de integridad; requiere definir contratos AsyncAPI. Liga a DRV-001/DRV-002.

### ADR-003: Migrar el runtime .NET Framework 4.8 / .NET Core 3.1 a .NET 8

- **Estado:** Aceptada.
- **Contexto:** Componentes criticos corren sobre .NET Framework 4.8 y .NET Core 3.1 (fuera de soporte), con Wordpress/XAMPP en produccion (GAP-005).
- **Decision:** Migrar los servicios a **.NET 8** contenerizado (SBB-006) y retirar Wordpress/XAMPP del canal B2C.
- **Consecuencias:** Cierra brechas de soporte y licenciamiento; implica esfuerzo de migracion por ola. Liga a DRV-005/DRV-004.

### ADR-004: WSO2 como plataforma de API Management frente a alternativas

- **Estado:** Aceptada.
- **Contexto:** El assessment analiza el ecosistema actual y recomienda una capa unica de gestion de APIs; existen alternativas (Kong, AWS API Gateway/MuleSoft, Apigee) [DOC-ASSUMPTION].
- **Decision:** Adoptar **WSO2 API Platform + Integration Platform** (SBB-001) por continuidad con la recomendacion del assessment y por cubrir API Management + integracion + Data Services en una sola plataforma; se mantiene la decision recalibrable si el cliente prefiere una alternativa cloud-native.
- **Consecuencias:** Minimiza fragmentacion de herramientas; crea dependencia de una plataforma que debe operarse y licenciarse. Liga a DRV-004.

### ADR-005: Fuente unica de verdad por dominio (consolidar +200 BDs)

- **Estado:** Aceptada.
- **Contexto:** Existen +200 bases de datos duplicadas/inconsistentes a nivel grupo con logica repetida y controles manuales en Excel (GAP-003).
- **Decision:** Establecer una **fuente unica de verdad por dominio** (SBB-007), con dominios de datos con duenio claro y los demas sistemas consumiendo via API/eventos en lugar de replicar BDs.
- **Consecuencias:** Reduce inconsistencia y reconciliacion manual; requiere migracion/consolidacion de datos y gobierno de dominios. Liga a DRV-002.

### ADR-006: Estrategia cloud en AWS para el TO-BE

- **Estado:** Aceptada.
- **Contexto:** La infraestructura AS-IS usa AWS (VPC, EC2, ALB/WAF segun los diagramas), con EC2 estaticos y un WS lento como cuello de botella (GAP-002).
- **Decision:** Desplegar los servicios de dominio .NET 8 contenerizados en **AWS** (VPC, ALB, WAF, orquestacion de contenedores) con escalamiento elastico y observabilidad (SBB-008, SBB-005), manteniendo el costo de infraestructura controlado (DRV-003).
- **Consecuencias:** Habilita escalamiento y resiliencia; exige IaC y disciplina de FinOps para no degradar costo. Liga a DRV-003/DRV-004.


### Como leer los ADR para estimar

ADR-002 (reemplazar el WS unico y la BD directa por Data Services + eventos) es el de mayor impacto en esfuerzo y riesgo, porque toca el punto mas acoplado del sistema. ADR-003 (migrar a .NET 8) es el de mayor extension. ADR-004 (elegir WSO2) es recalibrable y su cambio afectaria la estimacion de la plataforma de integracion. Leer los ADR en clave de esfuerzo/riesgo es parte del trabajo de estimacion.
## Implicaciones para la estimacion

Las decisiones fijan el stack y, con el, los factores de la tabla parametrica. Un cambio de ADR (p. ej. otra plataforma de API) obligaria a recalibrar la estimacion de los SBB afectados; por eso los ADR marcados recalibrables se vigilan como fuente de varianza.

## Implicaciones para la estrategia de implementacion

Las consecuencias de cada ADR definen prerrequisitos de implementacion (IaC y FinOps para AWS, contratos AsyncAPI para el desacople) que entran al roadmap como trabajo habilitador.

## Riesgos e incertidumbre

El riesgo es tratar un ADR aceptado como inmutable cuando el contexto cambia. El formato ADR mantiene la decision revisable y trazable, conteniendo ese riesgo. [DOC-ASSUMPTION]

</script>
<script type="text/plain" class="md-doc" data-doc-id="d-fase-4-diseno-to-be-arquitectura-c4"># Arquitectura TO-BE: vistas C4 y SBBs

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 4 - Diseno TO-BE**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../04-diseno-to-be.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

El diseño TO-BE materializa los ABBs en **Solution Building Blocks** (SBB-001..008) y los organiza en vistas C4 (contexto, contenedores, componentes). Esta es la columna vertebral tecnica del proyecto: una plataforma de API Management (WSO2), Data Services gobernados sobre Siesa, un bus de eventos, servicios de dominio en .NET 8, observabilidad y una estrategia cloud AWS. Cada SBB resuelve uno o varios gaps y habilita uno o varios drivers.

Para la estimacion, el mapeo ABB -> SBB es lo que convierte la arquitectura en trabajo contable: cada SBB es un paquete de esfuerzo con un stack objetivo definido, lo que permite tallar su construccion con criterio en lugar de adivinar.

## Mapeo ABB -> SBB (Hilo Dorado)

| Hilo Dorado | SBB (Solution Building Block) | ABB origen | Stack TO-BE |
| --- | --- | --- | --- |
| SBB-001 | API Gateway + plataforma de API Management (WSO2 API Platform + Integration Platform) | ABB-001 | WSO2 API Manager / Integration |
| SBB-002 | Data Services sobre el ERP Siesa (reemplazan la lectura directa a la BD) | ABB-002 | .NET 8 Data Services + WSO2 Data Services |
| SBB-003 | Bus de eventos / mensajeria para sincronizacion con Siesa | ABB-003 | Broker de eventos (AsyncAPI) |
| SBB-004 | Microservicios de dominio (.NET 8) por bounded context | ABB-004 | .NET 8 contenerizado |
| SBB-005 | Observabilidad y trazabilidad (logging/metricas/SLOs) | ABB-005 | CloudWatch + stack de observabilidad |
| SBB-006 | Migracion de runtime .NET Framework 4.8 / .NET Core 3.1 -> .NET 8 | ABB-006 | .NET 8 / contenedores |
| SBB-007 | Fuente unica de verdad por dominio (consolidar las +200 BDs duplicadas) | ABB-004 | SQL Server consolidado + dominios de datos |
| SBB-008 | Estrategia cloud AWS (VPC, ALB/WAF, escalamiento, contenedores) | ABB-006 | AWS (VPC, ALB, WAF, ECS/EKS) |

## Vistas C4 del TO-BE

### C4 Nivel 2 - Contenedores

```mermaid
flowchart LR

    subgraph DOM["Servicios de dominio .NET 8 - SBB-004"]

    end

### Lectura de las vistas

El patron central es un **API Gateway** que media todo el trafico y un **bus de eventos** que desacopla la escritura a Siesa. Esta eleccion arquitectonica es la que hace viable la continuidad operativa: permite desviar trafico del legado al TO-BE de forma incremental, sin un corte big-bang.

## NFR habilitados por los SBBs

| NFR TO-BE | Objetivo | SBB que lo habilita | Driver |
| --- | --- | --- | --- |
| Disponibilidad | 90% -> 99% | SBB-001, SBB-005 | DRV-001 |
| Eficiencia de recursos | 60% -> 80% (latencia base sin instrumentar hoy [EPISTEMIC-VOID]) | SBB-002, SBB-003 | DRV-002 |
| Costo de infraestructura | 80% -> 80% (sin degradar) | SBB-004 | DRV-003 |
| Evolucion/escalamiento | 50% -> 100% | SBB-004, SBB-006 | DRV-004 |
| Licenciamiento | 70% -> 100% | SBB-006 | DRV-005 |
## Implicaciones para la estimacion

Cada SBB es una unidad de estimacion con stack conocido. Los SBB de integracion (001, 002, 003) concentran el mayor esfuerzo y riesgo porque tocan el nucleo del acoplamiento; la Fase 5 los refleja en las tallas L/XL de los modulos asociados.

## Implicaciones para la estrategia de implementacion

La estrategia construye primero los SBB enabler (API Management, Data Services, observabilidad) y luego los servicios de dominio, aplicando Strangler Fig para migrar sin interrumpir. El diseño esta pensado para ser entregado por olas.

## Riesgos e incertidumbre

El riesgo arquitectonico es crear un nuevo cuello de botella en el gateway o el bus. Se mitiga con observabilidad (SBB-005) y rate limiting desde el inicio. [DOC-ASSUMPTION]

<script type="text/plain" class="md-doc" data-doc-id="d-fase-4-diseno-to-be-catalogo-ia"># Catalogo de oportunidades de IA

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

El catalogo de IA se modela como **skill declarativo** (no hardcodeado) y distingue dos pistas: IA-como-producto (casos de uso que agregan valor al negocio) e IA-como-acelerador-de-construccion (IA que acelera el propio desarrollo). Presentarlo aqui, dentro del informe tecnico, permite evaluar su viabilidad con los datos disponibles y evitar promesas sin sustento.

Para la estimacion, la IA se trata con prudencia: la mayoria de los casos son **spikes/experimentos** acotados, no alcance firme, porque su viabilidad depende de datos cuya calidad aun no esta garantizada.

## IA como producto

| AIP-003 | Cobranza Predictiva y Priorizada: Priorizacion de cartera y seleccion de canal/mensaje optimo por cliente para maximizar recaudo con menor costo de contacto. | Cobranza (SMS/WhatsApp/Email/Scheduler, Llamada Predictiva) | Historico de pagos y promesas, resultados por canal, estados de mora, respuesta a campanas previas. | Alta; datos operativos de cobranza suelen existir. [DOC-ASSUMPTION] sobre granularidad de resultados por canal. | Ola 3 - optimizacion de recaudo. |

| --- | --- | --- | --- | --- | --- |
| AIB-001 | Spec-to-Code: Generar scaffolding y codigo a partir de specs/HU estructuradas para acelerar la construccion de los modulos del roadmap. | Fabrica de software (rol AIA) | HU y specs AI-ready con criterios Gherkin, contratos OpenAPI/AsyncAPI, convenciones del repositorio. | Alta como acelerador; requiere specs de calidad (ver AIB-002). [DOC-ASSUMPTION] sobre adopcion del equipo. | Ola 1 - habilitadores de entrega. |
| AIB-002 | Specs AI-Ready: Estandarizar HU/specs en formato estructurado y trazable (AI-ready) para que spec-to-code y la generacion de pruebas sean fiables. | Fabrica de software (roles BA + AIA) | Plantillas de HU/Gherkin, catalogo de modulos, Hilo Dorado de trazabilidad. | Alta; es practica de proceso, bajo riesgo tecnico. | Ola 1 - habilitadores de entrega. |
| AIB-003 | Generacion Automatica de Pruebas: Derivar casos de prueba (unitarios/aceptacion) desde los criterios Gherkin de las HU para aumentar cobertura y reducir regresion. | Fabrica de software (rol AIA) | Criterios de aceptacion Gherkin, contratos de API, datos de ejemplo. | Alta cuando las specs son AI-ready (depende de AIB-002). | Ola 2 - calidad y automatizacion de pruebas. |

### Como se incorpora la IA sin inflar el alcance

Cada oportunidad lleva un gancho al roadmap y una nota de viabilidad. Las de viabilidad alta con datos disponibles pueden entrar como incremento; las demas se exploran en spikes de tiempo acotado. Asi la IA aporta valor sin convertirse en un riesgo de cronograma.
## Implicaciones para la estimacion

Las oportunidades de IA se estiman como spikes acotados salvo cuando la viabilidad es alta y los datos existen. Esto evita comprometer esfuerzo sobre casos cuya factibilidad aun es [DOC-ASSUMPTION].

## Implicaciones para la estrategia de implementacion

La estrategia prioriza primero la IA-como-acelerador (mejora la productividad del equipo desde el inicio) y difiere la IA-como-producto a cuando la plataforma de datos este consolidada.

## Riesgos e incertidumbre

El riesgo es sobreprometer capacidades de IA sin datos de calidad. El tratamiento por spikes y la nota de viabilidad por caso contienen ese riesgo. [DOC-ASSUMPTION]

<script type="text/plain" class="md-doc" data-doc-id="d-fase-4-diseno-to-be-ux-y-pruebas"># UX, BPMN TO-BE, Dry-Run y seguridad

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 4 - Diseno TO-BE**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../04-diseno-to-be.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

La vista de UX (service blueprint), el BPMN TO-BE, el paquete spec-driven (Gherkin), el acta de Dry-Run y la matriz de threat modeling (STRIDE) cierran el diseño asegurando que **la experiencia, el proceso, las reglas, las pruebas y la seguridad estan alineadas** antes de construir. El Dry-Run es la validacion de mesa (tabletop) que recorre la cadena Evento -> UX -> Gherkin -> API -> C4 -> BD -> respuesta.

Para la estimacion, el Dry-Run es un seguro barato: validar la coherencia end-to-end en papel antes de codificar evita retrabajo caro. La seguridad por diseño (STRIDE) tambien se estima aqui en lugar de añadirse al final como un parche.

## BPMN TO-BE

```mermaid
flowchart LR
    A([Cliente solicita credito]) --> B[UX: Formulario de solicitud]
    B --> C[API Gateway SBB-001]
    C --> D[Servicio Estudio de Credito]
    D --> E{Decision}
    E -- Aprobado --> F[Desembolso + RCL/RCR via Data Services Siesa]
    E -- Revision --> R[Cola de revision manual]
    E -- Rechazado --> X([Fin])
    F --> G[Recaudo: Link de Recaudo -> PayU]
    G --> H[Evento PagoAplicado al bus]
    H --> X
    R --> X
```


## Service blueprint

| Capa del Service Blueprint | Actividad (flujo estudio -> recaudo) |
| --- | --- |
| Evidencia fisica | Formulario web, confirmacion de aprobacion, link de pago |
| Acciones del cliente | Enviar solicitud, aceptar oferta, pagar en PayU |
| Frontstage (UX) | Pantalla de solicitud, pantalla de decision, pantalla de pago |
| Backstage | Orquestacion de buros, motor de reglas, generacion de RCL/RCR |
| Procesos de soporte | Data Services Siesa, bus de eventos, observabilidad |

## Paquete spec-driven (Gherkin)

### Escenarios ejecutables

```gherkin
# language: es
Caracteristica: Estudio de credito en Credi10 2.0

  Escenario: Aprobacion con buros disponibles (happy path)
    Dado un cliente con documento "CC123" y una solicitud "SOL-1"
    Cuando se invoca POST /estudio-credito con el documento y la solicitud
    Y CrossCore, Inspektor y Datacredito responden correctamente
    Entonces la decision es "APROBADO"
    Y se publica el evento de estudio en el bus

  Escenario: Buro no disponible (caso borde EX-01)
    Dado un cliente con documento "CC124" y una solicitud "SOL-2"
    Cuando se invoca POST /estudio-credito
    Y CrossCore agota el tiempo de espera
    Entonces el servicio responde con estado 424
    Y la solicitud queda encolada sin perderse

  Escenario: Escritura a Siesa falla (caso borde EX-04)
    Dado una solicitud "SOL-3" aprobada
    Cuando falla la escritura al ERP Siesa
    Entonces nunca se escribe directo a la base de datos del ERP
    Y se publica un evento para reintentar via Data Services

## Acta de Dry-Run / Tabletop

### Cadena de validacion extremo a extremo

| Eslabon de la cadena de validacion | Artefacto concreto |

## Threat modeling (STRIDE)

### Amenazas y mitigaciones

| Amenaza (STRIDE) | Vector | Mitigacion | SBB |
| --- | --- | --- | --- |
| Spoofing | Suplantacion de cliente o asesor | Autenticacion fuerte en el API Gateway | SBB-001 |
| Tampering | Manipulacion directa de la BD del ERP Siesa | Prohibir acceso directo; solo Data Services | SBB-002 |
| Repudiation | Falta de trazabilidad de operaciones | Logging y auditoria centralizada | SBB-005 |
| Information disclosure | Fuga de datos de buros | Cifrado extremo a extremo y minimizacion | SBB-001 |
| Denial of service | Saturacion del WS unico de Siesa | Bus de eventos + rate limiting en el gateway | SBB-003, SBB-001 |
| Elevation of privilege | Escalamiento via integraciones dispersas | Zero-trust y segmentacion por dominio | SBB-004 |
## Implicaciones para la estimacion

Las historias Gherkin (happy + borde) son unidades de estimacion finas; el catalogo exhaustivo 04b cubre todos los modulos sin muestreo. La seguridad por diseño añade esfuerzo que se contabiliza aqui, no despues.

## Implicaciones para la estrategia de implementacion

La estrategia valida cada ola con un Dry-Run antes del build (gobierno AICV-E del AM) y aplica zero-trust de forma transversal. El BPMN TO-BE guia el orden de construccion por tramo de proceso.

## Riesgos e incertidumbre

El riesgo es descubrir incoherencias (UX sin contrato, regla sin componente) en construccion. El Dry-Run los detecta antes, y STRIDE anticipa los vectores de ataque. [DOC-ASSUMPTION]

<script type="text/plain" class="md-doc" data-doc-id="d-fase-5-roadmap-estimacion-raid-estimacion-por-modulo"># Estimacion por modulo y modelo parametrico

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 5 - Roadmap, Estimacion y RAID**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../05-roadmap-estimacion-raid.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

Esta es la fase que da sentido a todo el advisory: una **estimacion por modulo** derivada de un modelo parametrico recalibrable, con cobertura COMPLETA de los modulos declarados (**17** modulos, sin muestreo). Cada modulo recibe una talla T-Shirt, story points ajustados, person-months y un WSJF, todo calculado de forma determinista a partir de parametros explicitos. La clave es la honestidad: **todas las cifras de esfuerzo son [DOC-ASSUMPTION]**, esfuerzo relativo para dimensionar, no un compromiso de fechas.

El objetivo declarado del engagement es 'estimar lo mas acertado posible'. Este modelo lo logra no inventando precision falsa, sino haciendo explicitos los supuestos: cambiar un parametro recalcula toda la estimacion, lo que permite hacer sensibilidad y converger con el equipo tecnico en un taller.

## Tabla parametrica recalibrable

| Parametro | Simbolo | Valor asumido [DOC-ASSUMPTION] | Que recalibra |
| --- | --- | --- | --- |
| Productividad (velocidad del squad) | v | 20 SP / person-month | Convierte story points en person-months |
| Factor de complejidad tecnica | fc | 1.15 | Sube/baja el esfuerzo por complejidad intrinseca |
| Factor de acople con legado | fl | 1.20 | Penaliza el acople con Siesa/.NET 4.8/Wordpress |
| Factor de riesgo de integracion | fi | 1.25 | Penaliza integracion con terceros (buros, PayU, WOLKVOX, VTEX) |

| Talla T-Shirt | Story points base (SP_base) [DOC-ASSUMPTION] |
| --- | --- |
| XS | 5 |
| S | 13 |
| M | 21 |
| L | 40 |
| XL | 80 |

> **Como se derivan las cifras (recalibrable).** Para cada modulo:
>
> `SP_ajustado = round(SP_base x fc x fl x fi)`
>
> `person_months = SP_ajustado / v`
>
> Con los valores asumidos [DOC-ASSUMPTION] el multiplicador compuesto es `fc x fl x fi = 1.15 x 1.20 x 1.25 = 1.725` y la velocidad `v = 20 SP/person-month`. Cambiar cualquier celda de la tabla parametrica o de los story points base recalcula TODA la estimacion por modulo de forma determinista. Las cifras son esfuerzo **relativo** [DOC-ASSUMPTION], no una oferta ni un compromiso de fechas absolutas.

## Estimacion detallada por modulo

| Modulo | Nombre | Bounded Context | Talla | SP base | SP ajustado [DOC-ASSUMPTION] | Person-months [DOC-ASSUMPTION] | CoD | Job Size | WSJF |
| --- | --- | --- | --- | ---: | ---: | ---: | ---: | ---: | ---: |
| MOD-01 | Plataforma Credi10 / Administracion de creditos | Plataforma / Core | L | 40 | 69 | 3,45 | 23 | 8 | 2.88 |
| MOD-02 | Originacion - CrossCore | Estudio de Credito | M | 21 | 36 | 1,80 | 24 | 5 | 4.8 |
| MOD-03 | Originacion - Inspektor | Estudio de Credito | M | 21 | 36 | 1,80 | 21 | 5 | 4.2 |
| MOD-04 | Originacion - Datacredito | Estudio de Credito | M | 21 | 36 | 1,80 | 24 | 5 | 4.8 |
| MOD-05 | Originacion - Aplicacion ADMIN | Originacion | M | 21 | 36 | 1,80 | 17 | 5 | 3.4 |
| MOD-06 | Pagos / GenerarPagos | Pagos | S | 13 | 22 | 1,10 | 19 | 3 | 6.33 |
