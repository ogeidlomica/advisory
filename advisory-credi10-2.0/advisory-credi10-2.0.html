<script type="text/plain" class="md-doc" data-doc-id="d-fase-5-roadmap-estimacion-raid-raid"># Matriz RAID (supuestos, restricciones, dependencias, prerrequisitos)

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 5 - Roadmap, Estimacion y RAID**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../05-roadmap-estimacion-raid.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

La matriz **RAID** consolida los supuestos, restricciones, dependencias y prerrequisitos que condicionan la ejecucion. Es el contrato de realidad del proyecto: enumera lo que debe ser cierto, lo que no puede cambiar, lo que depende de que, y lo que debe existir antes de arrancar cada frente. Sin RAID, una estimacion es una promesa sin condiciones.

Las restricciones son reales y vienen del RFP: preservar reglas de negocio, compatibilidad con proveedores actuales, continuidad operativa, dependencia del ERP Siesa y facturacion por entregables a 60 dias. Cada una moldea el roadmap y, por tanto, la estimacion de tiempos.

## Supuestos

| ID | Supuesto (Assumption) | Impacto si no se cumple | Dueno |
| --- | --- | --- | --- |
| A-01 | El equipo actual preserva el conocimiento de las reglas de negocio existentes | Reprocesos y regresiones funcionales | ORG |
| A-02 | Las cifras de tamanio (CFP/SP) se reconcilian en taller antes de comprometer olas [DOC-ASSUMPTION] | Desviacion de cronograma y costo | PM |
| A-03 | Los proveedores actuales (Siesa/UnoEE, PayU, buros) exponen contratos estables durante la transicion | Bloqueo del desacople | SA |

## Restricciones (del RFP)

| R-01 | **Preservar las reglas de negocio existentes** (requisito RFP) | Toda ola migra comportamiento 1:1 antes de optimizar; se prohibe reescribir reglas sin equivalencia verificada |
| R-02 | **Flexibilidad / compatibilidad con los proveedores actuales** (RFP) | Los contratos de integracion deben convivir con Siesa/UnoEE, PayU y los buros durante la transicion |
| R-03 | **Garantizar continuidad funcional y operativa durante la transicion** (RFP) | Se adopta Strangler Fig por ola; sin big-bang; rollback por ola |
| R-04 | **Dependencia fuerte del ERP Siesa/UnoEE** | Ola 1 debe entregar Data Services + eventos antes de retirar el WS unico / la lectura directa a BD |
| R-05 | **Facturacion por entregables y pago a 60 dias** (RFP) | El flujo de caja del proveedor condiciona el tamanio de cada ola/entregable |

## Dependencias

### Como el RAID disciplina la estimacion

Cada prerrequisito no cumplido es un bloqueo de ola; cada dependencia define un orden obligatorio; cada restriccion acota el espacio de solucion. El RAID es, en la practica, la lista de condiciones bajo las cuales la estimacion es valida.

Los supuestos de estimacion (reconciliar tallas en taller, estabilidad de contratos de proveedores) condicionan la validez de las cifras. La facturacion por entregables a 60 dias condiciona el tamanio de cada ola. [DOC-ASSUMPTION]

## Riesgos e incertidumbre

El riesgo es arrancar una ola con prerrequisitos abiertos (p. ej. sin el catalogo de contratos de Siesa). El RAID hace ese riesgo visible y asignable. [EPISTEMIC-VOID] en la linea base de disponibilidad (P-02).

<script type="text/plain" class="md-doc" data-doc-id="d-fase-5-roadmap-estimacion-raid-riesgo-de-desfase"># Evaluacion de suficiencia y riesgo de desfase

> Tema del **informe tecnico multinivel** de Credi10 2.0, dentro de **Fase 5 - Roadmap, Estimacion y RAID**. Vista narrativa que reorganiza y **enriquece** el informe plano de respaldo ([vista compacta de la fase](../../05-roadmap-estimacion-raid.md)); aqui el foco es la **interpretacion** de los hallazgos y sus implicaciones para la **estimacion**, la **estrategia de implementacion** y los **riesgos**.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** evidencia explicita del corpus; **[DOC-ASSUMPTION]** supuesto razonable a validar; **[DOC-CONFLICT]** tension entre fuentes; **[EPISTEMIC-VOID]** sin base documental (no se fabrica evidencia).

> **Hilo Dorado:** la trazabilidad end-to-end encadena Driver (DRV) -> Capability (CAP) -> Benchmark (BMK) -> Gap (GAP) -> Reliever (REL) -> ABB -> SBB -> Ola (WAV) -> ROI/Outcome, de modo que cada decision tecnica de este informe es trazable hasta un indicador de retorno del RFP.

## Que estamos mirando y por que importa

Esta seccion responde a la pregunta del dueño de negocio: **¿tenemos suficiente detalle para crear y arrancar el proyecto?** Y la complementa con un analisis de **riesgo de desfase de tiempos** (schedule-slip) atado a la cobertura del corpus. Es el cierre honesto del advisory: declara que es suficiente para planear olas y arrancar, pero insuficiente para comprometer fechas o presupuesto cerrado hasta cerrar los vacios.

Atar la incertidumbre de estimacion a la **cobertura del knowledge base** (bandas de cobertura y etiquetas epistemicas por documento) es lo que hace la estimacion defendible: los modulos sustentados por evidencia debil arrastran mas incertidumbre, y eso se declara en lugar de ocultarse.

## Scorecard de suficiencia (dueño de negocio)

| Dimension de suficiencia | Evidencia en el advisory | Veredicto |
| --- | --- | --- |
| Arquitectura de solucion (vistas) | C4 N1-3, ADR-001..006, 5 ERD, OpenAPI/AsyncAPI y BPMN en la Fase 4 | Suficiente para arrancar |
| Alcance funcional (HU/specs) | HU + BDD/Gherkin exhaustivos para los **17** modulos (cobertura COMPLETA, sin muestreo) | Suficiente para arrancar |
| Estimacion | Estimacion por modulo (T-Shirt + SP + person-months) con tabla parametrica recalibrable, toda [DOC-ASSUMPTION] | Suficiente para planear OLAS; insuficiente para comprometer FECHAS absolutas |
| Priorizacion y secuencia | WSJF global y por modulo + roadmap por olas con dependencias aciclicas y ruta critica | Suficiente para arrancar |
| Oportunidades de IA | Catalogo de IA como skills declarativos (no hardcodeado) consumido por la Fase 4 | Suficiente para explorar en spikes |
| Linea base economica | Modelo financiero estructurado pero SIN linea base real de costos ([EPISTEMIC-VOID] en Fase 6) | Insuficiente para comprometer presupuesto cerrado |

### Veredicto de suficiencia

El detalle alcanzado es **suficiente para CREAR y ARRANCAR el proyecto** (arquitectura, alcance funcional, estimacion por modulo, priorizacion y roadmap), pero el modelo economico sigue sin linea base real, de modo que no se puede comprometer presupuesto cerrado sin un ejercicio de costeo. Esta distincion es el nucleo de una estimacion honesta.

## Riesgo de desfase de tiempos (resumen)

> El analisis completo de **schedule-slip** (matriz probabilidad x impacto RS-01..RS-06, incertidumbre por cobertura del corpus por modulo y veredicto **Go/No-Go** de construccion, hoy **GO CONDICIONADO**) vive en la vista compacta de la fase ([../../05-roadmap-estimacion-raid.md](../../05-roadmap-estimacion-raid.md)) y se gobierna alli para no divergir del gate QG-5. Aqui se interpreta su implicacion: el desfase es mayor donde la cobertura documental es menor.
## Implicaciones para la estimacion

La incertidumbre de la estimacion no es uniforme: es mayor en los modulos cuyo soporte documental es [EPISTEMIC-VOID] o de baja cobertura. La estimacion acertada consiste precisamente en declarar esa varianza, no en esconderla.

## Implicaciones para la estrategia de implementacion

La estrategia reduce el riesgo de desfase cerrando primero los vacios de mayor impacto (contrato de Siesa, linea base de disponibilidad) antes de comprometer las olas que dependen de ellos.

## Riesgos e incertidumbre

El veredicto es **GO CONDICIONADO**: se puede arrancar, pero con contingencia explicita y con el compromiso de cerrar los prerrequisitos criticos. Ignorar esa condicion es el camino directo al desfase. [DOC-ASSUMPTION]

<script type="text/plain" class="md-doc" data-doc-id="d-fase-6-caso-de-negocio-value-driver-tree"># Value driver tree y outcomes de negocio

## Que estamos mirando y por que importa

El caso de negocio cierra el Hilo Dorado conectando cada outcome tecnico con un **outcome de negocio** (ROI-001..005), uno por cada driver del RFP. El value driver tree es la narrativa de valor: muestra como la observabilidad y el API Management habilitan disponibilidad, como el desacople de Siesa habilita eficiencia, y asi sucesivamente. Es la respuesta a '¿para que todo este esfuerzo?'.

Para la estimacion, el value driver tree es el que justifica la inversion: ata el esfuerzo estimado a un retorno esperado, aunque ese retorno siga siendo [DOC-ASSUMPTION] mientras no haya linea base de costos.

### Lectura del arbol de valor

Cada outcome de negocio esta entregado por olas concretas, de modo que el valor no es abstracto: se puede rastrear hasta la WAV que lo produce. Esto permite al negocio ver que ola captura que retorno y decidir la secuencia con criterio economico.

El valor esperado por driver permite comparar inversion vs. retorno por ola y decidir el alcance financiable. Sin linea base real, el retorno se expresa como estructura [DOC-ASSUMPTION], no como promesa.

La estrategia prioriza las olas que entregan los outcomes de mayor valor temprano (disponibilidad y eficiencia), alineando el orden de entrega con la captura de valor.

El riesgo es comprometer ROI sin datos. El value driver tree estructura el valor pero lo marca [DOC-ASSUMPTION] hasta el costeo. [EPISTEMIC-VOID] en la linea base economica.

## Metodo de derivacion (determinista y dinamico)

Las solicitudes se extraen priorizando el documento `primary` tipo RFP (heuristica de rol/nombre) y complementando con el resto del corpus. En cada documento se localizan **anclas de seccion** portadoras de requisitos (objetivos, alcance, requisitos, informes requeridos, evaluacion, indicadores de retorno) mediante una normalizacion **sin espacios y sin acentos** robusta a la fragmentacion del PDF escaneado; como respaldo generico se detectan numerales/vinetas. Cada solicitud recibe un **ID estable** `REQ-NNN` en orden de documento, una **cita** a su documento (y seccion cuando es recuperable) y un **Estado** honesto derivado del **texto util real** y el flag epistemico de la Base de Conocimiento: **Pendiente + [EPISTEMIC-VOID]** cuando el documento fuente no tiene texto util (OCR pendiente).

<script type="text/plain" class="md-doc" data-doc-id="d-anexo-b-arquitectura-extraccion"># Anexo B - Arquitectura IA multicapa de extraccion de texto util

> **Anexo del informe tecnico** de Credi10 2.0. Presenta, como **recomendacion de advisory**, la arquitectura de **ingesta documental multicapa (L1-L4)** cuyo objetivo es **maximizar el texto util real** de todo el corpus. Esta gobernado por el skill generico [`document-extraction-architecture`](../../../../.kiro/skills/document-extraction-architecture/SKILL.md) e integra las politicas [`complete-corpus-ingestion`](../../../../.kiro/skills/complete-corpus-ingestion/SKILL.md), [`ocr-image-extraction`](../../../../.kiro/skills/ocr-image-extraction/SKILL.md) y [`token-budget-optimization`](../../../../.kiro/skills/token-budget-optimization/SKILL.md).

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** capa de texto nativa util (incluida la recuperada por decodificacion de fuentes) o transcripcion humana estatica; **[OCR-EXTRACTED]** texto recuperado por OCR o por modelo de vision; **[EPISTEMIC-VOID]** no recuperable en este entorno (no se fabrica); **[DOC-ASSUMPTION]** supuesto a validar; **[DOC-CONFLICT]** tension entre fuentes.

## 1. Por que una arquitectura de extraccion y no un extractor unico

El analisis de cobertura del corpus revelo un patron que suele pasar inadvertido y que, de no corregirse, contamina toda la estimacion: varios PDFs que parecian 'vacios' o 'solo imagen' **si tenian una capa de texto real**, pero codificada con fuentes embebidas de codificacion personalizada (`Type0`/`Identity-H` con un CMap `/ToUnicode` por fuente). Un extractor ingenuo que lee literales `( ... )` sin aplicar el mapeo por fuente devuelve ruido, y ademas tiende a ingerir bytes binarios de imagenes y programas de fuente como si fueran texto, hundiendo artificialmente el ratio de texto util. El diagnostico, por tanto, no era 'faltan documentos' sino 'falta la capa de extraccion correcta para cada tipo de documento'.

De ahi la decision de advisory: en lugar de un unico extractor, se adopta una **arquitectura por capas** que aplica a cada documento la tecnica mas barata y mas fiel capaz de recuperar su contenido, y **escala** a capas mas potentes solo cuando la capa previa no alcanza el umbral de texto util. Es una estrategia de **maximizacion del texto util con degradacion honesta**: lo que una capa no recupera lo intenta la siguiente, y lo que ninguna capa disponible recupera se marca como vacio epistemico en vez de inventarse. Esta disciplina es lo que convierte la ingesta en un cimiento defendible para la estimacion: cada afirmacion del informe queda anclada a texto realmente recuperado y etiquetado segun su procedencia.

## 2. La escalera de capas (estrategia)

La estrategia organiza la extraccion como una escalera de cuatro capas. Cada documento ocupa la capa mas baja que supere el umbral de texto util (`MIN_USEFUL_RATIO_FOR_TEXT`, 3%); solo escala cuando esa capa se queda corta. Preferir la capa mas baja no es una preferencia estetica: la capa L1 es la unica **determinista y sin costo de inferencia**, reproduce el original sin alucinaciones y no depende de servicios externos.

| Capa | Que hace | Tecnologia tipica | Etiqueta | Estado aqui |
| --- | --- | --- | --- | --- |
| **L1** Texto nativo + decodificacion de fuentes | Lee la capa de texto del PDF y decodifica fuentes embebidas de codificacion personalizada (CMap `/ToUnicode`, `/Encoding /Differences`, `Type0`/`Identity-H`). | stdlib (`zlib`+`re`), sin red | `[VERIFIED-FACT]` | **IMPLEMENTADA** |
| **L2** OCR de paginas imagen | Rasteriza y aplica OCR a paginas que son imagen/escaneo sin capa de texto. | Tesseract / ocrmypdf | `[OCR-EXTRACTED]` | Requiere produccion |
| **L3** Vision / LLM multimodal | Interpreta layout complejo, tablas, formularios y diagramas. | Document AI / LLM multimodal | `[OCR-EXTRACTED]` | Requiere produccion |
| **L4** NLP / LLM de post-proceso | Estructura, normaliza y extrae entidades/hechos con trazabilidad, sin inventar lo ausente. | NLP / LLM con citas | hereda la capa origen | Requiere produccion |

La regla de oro de la capa L4 es que **estructura y normaliza lo ya recuperado por L1-L3, sin inventar** datos que el texto no contiene: si una entidad no aparece en el texto extraido, queda como `[EPISTEMIC-VOID]`, no se completa por inferencia del modelo. Esta frontera entre 'normalizar' y 'fabricar' es la que preserva la honestidad epistemica del advisory cuando entran modelos generativos.

## 3. Flujo de decision con fallback (tactica)

La tactica concreta es un flujo de decision que evalua el **texto util real** de cada documento y escala de capa hasta cruzar el umbral o agotar las capas disponibles en el entorno. El flujo es tolerante a fallos (un error en una capa degrada a la siguiente, nunca aborta el pipeline) y determinista (re-ejecutar deja la salida byte-identica).

```mermaid
flowchart TD
    DOC["Documento del corpus"] --> L1["L1 - Texto nativo + decodificacion de fuentes<br/>(ToUnicode / Differences)"]
    L1 --> U1{"texto util &gt;= umbral?"}
    U1 -- "si" --> OK1["Aceptar L1<br/>[VERIFIED-FACT]"]
    U1 -- "no" --> IMG{"pagina es imagen / escaneo?"}
    IMG -- "si" --> L2["L2 - OCR de paginas imagen<br/>(Tesseract / ocrmypdf)"]
    IMG -- "no" --> HEUR["Fuente sin mapa: heuristico latin-1"]
    L2 --> U2{"confianza OCR y texto util &gt;= umbral?"}
    U2 -- "si" --> OK2["Aceptar L2<br/>[OCR-EXTRACTED]"]
    U2 -- "no" --> L3["L3 - Vision / LLM multimodal<br/>(layout, tablas, diagramas)"]
    L3 --> U3{"texto util &gt;= umbral?"}
    U3 -- "si" --> OK3["Aceptar L3<br/>[OCR-EXTRACTED]"]
    U3 -- "no" --> VOID["[EPISTEMIC-VOID]<br/>pendiente, no se fabrica"]
    OK1 --> L4["L4 - NLP / LLM<br/>estructura, normaliza y extrae entidades con trazabilidad"]
    OK2 --> L4
    OK3 --> L4
    HEUR --> L4
    L4 --> OUT["Texto util maximizado<br/>+ hechos trazables"]
```


El diagrama hace explicito el punto de bifurcacion mas importante: cuando L1 no alcanza el umbral, la pregunta no es 'aplicar OCR o no' sino **por que** la capa de texto es insuficiente. Si la pagina es realmente una imagen/escaneo, corresponde L2 (OCR); si hay capa de texto pero la fuente carece de mapa, corresponde el heuristico de respaldo. Distinguir ambos casos evita gastar OCR donde bastaba decodificar una fuente, que es exactamente el error que inflaba el problema en este corpus.

## 4. Tactica por tipo de documento

La capa de entrada se elige segun la naturaleza del documento. Esta tabla es la guia operativa que el motor aplica y que el equipo de produccion debe respetar al activar L2-L4:

| Tipo de documento | Capa recomendada | Fallback | Nota |
| --- | --- | --- | --- |
| PDF con capa de texto nativa limpia | L1 | - | Caso ideal, costo minimo. |
| PDF con fuentes embebidas de codificacion personalizada (`Type0`/`Identity-H`, `/ToUnicode`) | L1 (decodificacion de fuentes) | L2 | El contenido SI existe; hay que decodificarlo, no escanearlo. |
| PDF escaneado / pagina imagen (`DCTDecode`, sin capa de texto) | L2 (OCR) | L3 | Requiere motor OCR en el entorno. |
| PDF con tablas / formularios / layout complejo | L3 (vision/LLM) | L2 | El OCR plano pierde la estructura. |
| Diagrama / plano (PNG/JPG) de arquitectura | Transcripcion humana estatica `[VERIFIED-FACT]` o L3 | L2 | El valor esta en relaciones, no en texto corrido. |
| Documento ofimatico nativo (docx/xlsx/pptx) | L1 (parser del formato) | L4 | Texto ya estructurado; L4 normaliza entidades. |

### Lectura de los resultados

La decodificacion de fuentes de **L1 recupero texto nativo real** en todo el bloque de PDFs. En particular, el assessment WSO2/Studio F paso de **1.60%** de texto util (banda 'nula', `[EPISTEMIC-VOID]`) a **74.90%** (banda 'alta', `[VERIFIED-FACT]`); y **5 de 5** PDFs que estaban en banda 'nula' con `[EPISTEMIC-VOID]` cruzaron el umbral de texto util (3%) y hoy son texto nativo `[VERIFIED-FACT]`: Api Integrador Atencion al cliente.pdf, B2C.pdf, Originacion_API_Inspektor.pdf, ProcesoCorteCartera.pdf, WSO2 y Studio F - Assessment Mayo2026-Final.pdf. El salto se explica porque su capa de texto SI existia pero usaba fuentes con CMap `/ToUnicode`; el extractor consciente de la fuente (`engine/pdf_text.py`) la decodifica y lee solo dentro de objetos de texto `BT ... ET`, recuperando espanol legible como 'aplicacion', 'arquitectura' o 'integracion'.

Es importante subrayar que esta recuperacion es de **texto nativo**, no de OCR: el documento siempre tuvo el texto, solo estaba mal decodificado. Por eso conserva la etiqueta `[VERIFIED-FACT]` y no `[OCR-EXTRACTED]`. El adaptador OCR del motor sigue degradando honestamente (0 OCR en este entorno), sin fabricar contenido.

## 6. Alcance: lo IMPLEMENTADO aqui (L1) vs. lo que requiere produccion (L2-L4)

> **Marca de alcance explicita.** En este entorno (stdlib-only, sin red, sin motor OCR) **solo la capa L1 esta implementada y en ejecucion**. Las capas L2, L3 y L4 estan **disenadas y listas por contrato**, pero su activacion requiere el **entorno de produccion**.

| Capa | Estado en este entorno | Requiere para activarse |
| --- | --- | --- |
| **L1** texto nativo + decodificacion de fuentes | **IMPLEMENTADA y ejecutada** (`advisory-system/engine/pdf_text.py`, stdlib) | nada |
| **L2** OCR de paginas imagen | **No disponible** (degradacion honesta) | Tesseract / ocrmypdf en el entorno |
| **L3** vision / LLM multimodal | **No disponible** | Document AI / LLM multimodal con red |
| **L4** NLP / LLM de post-proceso | **No disponible** | servicio NLP / LLM con red |

Lo que **L1 NO resuelve** y queda explicitamente para L2-L4 en produccion: las paginas que son imagenes reales (JPEG `DCTDecode` sin capa de texto) siguen necesitando **OCR real (L2)**; el layout complejo, las tablas y los diagramas se interpretan mejor con **vision/LLM (L3)**; y la estructuracion y extraccion de entidades con trazabilidad es trabajo de **L4**. Nada de esto se simula aqui: cuando el mismo corpus se procese en produccion, L2-L4 se activan sin cambiar la estrategia ni las etiquetas epistemicas ya definidas.

## 7. Implicaciones para la estimacion, la estrategia y los riesgos

**Para la estimacion.** Al recuperar como texto nativo los PDFs que antes eran vacios epistemicos, los frentes que dependian de esos documentos (assessment WSO2, procesos de cartera, integraciones de originacion) pasan a estar soportados por evidencia `[VERIFIED-FACT]` y se pueden tallar con mayor confianza, reduciendo la contingencia que antes cargaba la incertidumbre documental.

**Para la estrategia de implementacion.** La arquitectura por capas se implanta de forma incremental: L1 es inmediata y sin costo externo; L2 se habilita cuando el entorno de produccion disponga de motor OCR; L3 y L4 se incorporan cuando se justifique el layout complejo o la extraccion de entidades a escala. La priorizacion por presupuesto de tokens cambia el orden/esfuerzo de las capas, nunca excluye un documento.

**Para los riesgos.** El riesgo dominante es confundir 'documento sin texto util' con 'documento sin informacion': este corpus demostro que el contenido estaba presente y mal decodificado. La arquitectura mitiga ese riesgo obligando a diagnosticar la causa (fuente sin mapa vs. imagen real) antes de escalar de capa, y manteniendo la degradacion honesta para no fabricar lo que no se recupera. `[DOC-ASSUMPTION]` cualquier cifra de L2-L4 queda sujeta a su activacion en produccion.

## 8. Trazabilidad con las politicas de la organizacion

Este anexo materializa, sobre el corpus real de Credi10, la politica generica [`document-extraction-architecture`](../../../../.kiro/skills/document-extraction-architecture/SKILL.md): la capa L1 es su implementacion de referencia; L2 es la tactica de [`ocr-image-extraction`](../../../../.kiro/skills/ocr-image-extraction/SKILL.md); la cobertura total sin muestreo es la obligacion de [`complete-corpus-ingestion`](../../../../.kiro/skills/complete-corpus-ingestion/SKILL.md); y el control de volumen de L4 obedece a [`token-budget-optimization`](../../../../.kiro/skills/token-budget-optimization/SKILL.md). Para volver al indice maestro del informe tecnico ver [`../README.md`](../README.md).

<script type="text/plain" class="md-doc" data-doc-id="d-anexo-c-en-que-cambio"># Anexo C - En que cambio: evidencia ANTES vs AHORA y suficiencia para definir el proyecto

> **Anexo del informe tecnico** de Credi10 2.0. Responde, con cifras leidas de la Base de Conocimiento del run, la pregunta del negocio: tras recuperar la capa de texto nativa de los documentos que antes eran **vacios epistemicos**, ¿con esta informacion podemos definir el proyecto con tranquilidad y, si no, que % exige todavia una **conceptualizacion / etapa de especificacion** adicional? Es un artefacto **generado** y **determinista** (se recomputa si el corpus cambia); no se escribe a mano.

> **Etiquetas epistemicas:** **[VERIFIED-FACT]** texto nativo util recuperado (incluida la decodificacion de fuentes) o transcripcion humana; **[EPISTEMIC-VOID]** no recuperable / ausente (no se fabrica); **[DOC-ASSUMPTION]** supuesto a validar.

## 1. Que cambio en una frase

La recuperacion de texto nativo (L1: `/ToUnicode` por fuente + reconstruccion lexica) movio a **5 de 5** documentos desde el **vacio epistemico** ([EPISTEMIC-VOID]) hacia **evidencia verificada** ([VERIFIED-FACT]). En concreto, el Assessment WSO2/Studio F paso de **1.60%** de texto util (vacio epistemico) a **74.90%** ([VERIFIED-FACT]). El corpus paso de **5 documentos en vacio** a **0 en vacio** hoy, y esos cinco documentos, que antes aportaban **~0** hechos clave trazables, hoy aportan **60** (de un total de **193** hechos clave en todo el corpus). El diagnostico, la arquitectura y la estimacion de los frentes que dependian de esos documentos dejan de apoyarse en supuestos y pasan a citar evidencia real.

## 2. ANTES vs AHORA de los documentos recuperados

Las cifras 'antes' son la linea base declarativa previa a la decodificacion de fuentes (`knowledge.USEFUL_TEXT_BASELINE_PCT`); las 'ahora', la banda, el flag y el conteo de hechos se leen de la Base de Conocimiento viva. No hay cifras hardcodeadas en esta tabla.

| # | Documento (antes [EPISTEMIC-VOID]) | Texto util antes | Texto util ahora | Delta | Banda ahora | Flag ahora | Hechos clave |
| --- | --- | ---: | ---: | ---: | --- | --- | ---: |

## 6. ¿Podemos definir el proyecto con tranquilidad? Veredicto de suficiencia

**Cobertura de evidencia documental del corpus: ~100%** (100% de los 18 documentos con [VERIFIED-FACT]). Este porcentaje mide cuanta **evidencia leible** respalda hoy el advisory, y **no** la preparacion total para **comprometer** alcance, fechas y presupuesto. La distincion es decisiva para responder la pregunta del negocio:

- **Lo que SI habilita la evidencia recuperada (suficiente para arrancar).** El diagnostico AS-IS, el catalogo de modulos/historias y la estimacion por olas ya se apoyan en texto verificado; se puede **iniciar la construccion por olas** (enablers WAV-000/WAV-001) con confianza razonable. Esto es coherente con el veredicto **GO CONDICIONADO** de la Fase 5.
- **Lo que AUN exige una etapa de conceptualizacion / especificacion.** Que la evidencia **documental** este al ~100% NO significa que la **especificacion de la solucion objetivo** lo este: la evidencia recuperada es **documentacion tecnica del AS-IS existente**, no un diseno comprometible. Persisten vacios que ningun OCR cierra porque **no estan en ningun documento**: (1) **mediciones ausentes** (SLA/latencia hoy sin instrumentar [EPISTEMIC-VOID]) y (2) **linea base de costos** para el caso de negocio [EPISTEMIC-VOID]; y las specs recuperadas de los modulos deben **ratificarse 1:1 con el cliente** (riesgo RS-03).

> **Lectura honesta (porcentajes).** La base **documental** para encuadrar el proyecto esta cubierta al **~100%**. Pero para pasar de 'arrancar' a 'comprometer alcance, fechas y presupuesto con tranquilidad' se requiere todavia una **etapa de conceptualizacion / especificacion** acotada (sprint 0 / descubrimiento), estimada en **~15-20% de esfuerzo adicional de advisory [DOC-ASSUMPTION]**, que cierre lo que el corpus no contiene: (a) **~10-15%** levantar la **linea base de medicion** (disponibilidad/latencia reales) y de **costos** para el caso de negocio; (b) **~5%** **ratificar las specs recuperadas** de originacion, cartera, pagos e integracion WSO2 en talleres con el cliente; y (c) **recalibrar la estimacion** con conteo funcional historico. Estos porcentajes son una **guia de advisory [DOC-ASSUMPTION]**, no una medicion; se afinan en el sprint 0. Sin ese cierre, comprometer fechas absolutas de las olas 2 y 3 incurre en alto riesgo de desfase (ver Fase 5, RS-01..RS-06).
